# Fails a PR when the pnpm deps hash in flake.nix no longer matches pnpm-lock.yaml. Renovate
# changes the lockfile but not the hash, so `nix build` breaks after such a PR is merged.
# Fix it locally with `nix run github:shiroinock/workflows#nix-hashes -- --fix .#default.pnpmDeps`.
# The job lives in shiroinock/workflows; change it there, not here.
name: Nix のハッシュ

on:
  # Every PR: a required check has to report on all of them.
  pull_request:

permissions: {}

jobs:
  hashes:
    uses: shiroinock/workflows/.github/workflows/nix-hashes.yml@b586023844ba16a3a650bfa3db021be733a5f8aa
    permissions:
      contents: read
    with:
      installables: .#default.pnpmDeps
      workflows_ref: b586023844ba16a3a650bfa3db021be733a5f8aa # the same SHA as the uses: line above
