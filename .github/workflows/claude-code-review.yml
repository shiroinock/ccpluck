# PR を Claude Code で自動レビューする（公式ドキュメントの例に沿う）
# https://code.claude.com/docs/en/github-actions.md
#
# - fork からの PR ではシークレットが渡らないため動かない（同じリポジトリのブランチからの PR だけ）
# - pull_request_target は使わない（信頼できないコードがベースのシークレット付きで動くため）
# - 起動できるのは書き込み権限のある人の PR だけ（アクションの既定）
# - 認証は Claude の契約のトークン（`claude setup-token`）をシークレット CLAUDE_CODE_OAUTH_TOKEN に入れる
# - コメントの投稿は Claude GitHub App（https://github.com/apps/claude）を通す。リポジトリに App を入れておくこと
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 下書きの PR はレビューしない
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # --comment で、見つけたことを PR にコメントとして書く
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # インラインコメントのツールは、ここで名前を挙げたときだけ起動する
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
