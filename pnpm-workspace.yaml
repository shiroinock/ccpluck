packages:
  - "packages/*"
  - "apps/*"

# Supply chain: install only versions published at least 3 days ago (in minutes).
# Renovate waits 7 days for ordinary updates and 3 for security fixes.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Renovate security update: vite@6.4.4
  - vite@6.4.4
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
